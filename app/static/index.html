<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Snip — URL shortener</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262a33;
    --text: #e7ebf0;
    --muted: #8a93a3;
    --accent: #6c8cff;
    --accent-hover: #8aa3ff;
    --ok: #4ade80;
    --err: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1a2140 0%, transparent 60%),
                radial-gradient(900px 500px at 100% 110%, #2a1a40 0%, transparent 55%),
                var(--bg);
    color: var(--text);
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.01em; }
  p.sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  form { display: flex; gap: 8px; }
  input[type=url] {
    flex: 1; padding: 12px 14px; border-radius: 10px;
    background: #0c0f15; color: var(--text);
    border: 1px solid var(--border); outline: none; font-size: 14px;
  }
  input[type=url]:focus { border-color: var(--accent); }
  button {
    padding: 12px 18px; border-radius: 10px; border: 0; cursor: pointer;
    background: var(--accent); color: #0b0d12; font-weight: 600; font-size: 14px;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .result {
    margin-top: 18px; padding: 14px; border-radius: 10px;
    background: #0c0f15; border: 1px solid var(--border);
    display: none;
  }
  .result.show { display: block; }
  .result.error { border-color: rgba(248,113,113,.4); }
  .row { display: flex; gap: 8px; align-items: center; }
  .short {
    flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--ok); word-break: break-all; font-size: 14px;
  }
  .copy {
    background: transparent; color: var(--text);
    border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px;
    font-size: 13px;
  }
  .copy:hover { border-color: var(--accent); }
  .meta { margin-top: 8px; color: var(--muted); font-size: 12px; }
  .err { color: var(--err); font-size: 14px; }
</style>
</head>
<body>
  <main class="card">
    <h1>Snip</h1>
    <p class="sub">Paste a long URL, get a short one.</p>
    <form id="f">
      <input id="url" type="url" placeholder="https://example.com/very/long/path" required autofocus />
      <button id="go" type="submit">Shorten</button>
    </form>
    <div id="out" class="result" aria-live="polite"></div>
  </main>
<script>
const form = document.getElementById('f');
const input = document.getElementById('url');
const btn = document.getElementById('go');
const out = document.getElementById('out');

function show(html, error = false) {
  out.className = 'result show' + (error ? ' error' : '');
  out.innerHTML = html;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const long_url = input.value.trim();
  btn.disabled = true; btn.textContent = 'Shortening…';
  out.className = 'result';

  try {
    const resp = await fetch('/shorten', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ long_url }),
    });
    const data = await resp.json().catch(() => ({}));

    if (resp.status === 429) {
      show(`<div class="err">Rate limit hit. ${data.error ?? 'Try again in a minute.'}</div>`, true);
    } else if (!resp.ok) {
      const msg = data.detail?.[0]?.msg || data.detail || data.error || `HTTP ${resp.status}`;
      show(`<div class="err">${msg}</div>`, true);
    } else {
      const shortUrl = data.short_url;
      const expiresAt = new Date(data.expires_at).toLocaleString();
      show(`
        <div class="row">
          <a class="short" href="${shortUrl}" target="_blank" rel="noopener">${shortUrl}</a>
          <button class="copy" type="button" id="cp">Copy</button>
        </div>
        <div class="meta">Expires ${expiresAt}</div>
      `);
      document.getElementById('cp').addEventListener('click', async () => {
        await navigator.clipboard.writeText(shortUrl);
        document.getElementById('cp').textContent = 'Copied';
      });
    }
  } catch (err) {
    show(`<div class="err">${err.message}</div>`, true);
  } finally {
    btn.disabled = false; btn.textContent = 'Shorten';
  }
});
</script>
</body>
</html>
